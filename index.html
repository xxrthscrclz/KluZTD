<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KluZTD</title>
    <meta name="description" content="다 적고, 분류하고, 보드에서 진행하고, 기록하는 나만의 할 일 관리" />
    <meta name="theme-color" content="#f6f5f2" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KluZTD" />
    <link rel="icon" type="image/png" sizes="256x256" href="./logo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      // 첫 화면 깜빡임 방지: 저장된 테마를 렌더 전에 적용
      try {
        var mode = (JSON.parse(localStorage.getItem('kluztd:theme') || '{}').state || {}).mode || 'system';
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
