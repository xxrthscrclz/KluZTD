<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="KluZTD">
  <defs>
    <linearGradient id="kz-tile" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B2A5B"/>
      <stop offset=".5" stop-color="#1D6FE8"/>
      <stop offset="1" stop-color="#5BB8FF"/>
    </linearGradient>
    <linearGradient id="kz-check" x1="18" y1="40" x2="48" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF8FF"/>
    </linearGradient>
    <filter id="kz-shadow" x="-16%" y="-16%" width="132%" height="138%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2" flood-color="#0B58D1" flood-opacity=".26"/>
    </filter>
  </defs>

  <g filter="url(#kz-shadow)">
    <!-- 수집함을 뜻하는 둥근 타일 -->
    <rect x="5" y="5" width="54" height="54" rx="16" fill="url(#kz-tile)"/>
    <!-- 정리된 리스트 라인 세 줄 -->
    <path
      d="M17 22.5h13M17 32h9M17 41.5h6"
      stroke="#BDE8FF"
      stroke-width="2.6"
      stroke-linecap="round"
      opacity=".5"
    />
    <!-- 완료 체크 — 흐름이 아래에서 위로 -->
    <path
      d="m20 36.5 8.5 8.5L47 20.5"
      stroke="url(#kz-check)"
      stroke-width="5.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- 다음 행동을 가리키는 작은 별 -->
    <path
      fill="#EAF8FF"
      d="m50.5 8.5 1.4 4.2 4.1 1.4-4.1 1.4-1.4 4.2-1.4-4.2-4.2-1.4 4.2-1.4 1.4-4.2Z"
      opacity=".95"
    />
  </g>
</svg>
